# PR titles must be Conventional Commits: squash merge makes the title the commit on main. This repo has no
# releases; the rule matches home-budget so history reads the same in both. Required check on main. The title is passed through env, never interpolated
# into the script. Types and examples: CONTRIBUTING.md.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the title pattern
        run: .github/scripts/pr-title.test.sh
      - name: Check the title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: .github/scripts/pr-title.sh "$TITLE"

# End-to-end + accessibility tests against home-budget's local `wrangler dev` (never production).
# Runs on PRs, pushes to main, nightly (catches app changes that break e2e) and by hand. Also callable from
# home-budget as a reusable workflow (wired up with deploy gating later). The "lint" and "e2e" jobs are
# required checks on main. Every run prints the home-budget commit it tested.
name: e2e

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 8 * * *" # daily 08:41 UTC
  workflow_dispatch:
    inputs:
      app-ref:
        description: home-budget branch, tag or SHA to test
        default: main
  workflow_call:
    inputs:
      app-ref:
        description: home-budget branch, tag or SHA to test
        type: string
        default: main

permissions: {}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # playwright-test-commons installs from a GitHub tag; the lockfile records it as git+ssh.
      - run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out home-budget
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: benweese/home-budget
          ref: ${{ inputs.app-ref || 'main' }}
          path: home-budget
          persist-credentials: false
      - name: Print the home-budget commit under test
        run: echo "::notice title=home-budget under test::$(git -C home-budget rev-parse HEAD)"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            home-budget/package-lock.json
      - run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/
      - name: Build home-budget
        working-directory: home-budget
        run: |
          npm ci
          npm run app:build
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
        env:
          APP_DIR: home-budget
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
